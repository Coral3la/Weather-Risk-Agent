<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather Risk Intelligence Agent</title>
<style>
  :root {
    --ink: #1c2530; --muted: #5f6b7a; --line: #d9dee5; --page: #f4f6f8;
    --card: #ffffff; --accent: #1f5f8b; --user: #e3eef6;
    --high: #2e7d4f; --medium: #b07a12; --low: #b3392f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 15px/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    background: var(--card); border-bottom: 1px solid var(--line);
    padding: 12px 20px; display: flex; align-items: center; gap: 16px;
  }
  header h1 { font-size: 17px; margin: 0; }
  header p { margin: 0; color: var(--muted); font-size: 13px; flex: 1; }
  main { flex: 1; overflow-y: auto; padding: 20px; }
  #chat { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .message { padding: 12px 16px; border-radius: 10px; max-width: 92%; }
  .user { background: var(--user); align-self: flex-end; white-space: pre-wrap; }
  .agent { background: var(--card); border: 1px solid var(--line); align-self: flex-start; }
  .agent .text { white-space: pre-wrap; }
  .error { border-color: var(--low); color: var(--low); }
  .pending { color: var(--muted); font-style: italic; }
  .badge {
    display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px;
    border-radius: 10px; color: #fff; background: var(--muted); margin-bottom: 6px;
  }
  .badge.high { background: var(--high); }
  .badge.medium { background: var(--medium); }
  .badge.low { background: var(--low); }
  details { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; font-size: 13.5px; }
  summary { cursor: pointer; color: var(--accent); font-weight: 600; }
  details h3 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); margin: 14px 0 4px;
  }
  details ul, details ol { margin: 0; padding-left: 20px; }
  details li { margin-bottom: 4px; }
  code { font: 12.5px ui-monospace, Menlo, Consolas, monospace; background: var(--page); padding: 1px 4px; border-radius: 4px; }
  .result { color: var(--muted); }
  table { border-collapse: collapse; }
  td, th { text-align: left; padding: 2px 14px 2px 0; }
  th { color: var(--muted); font-weight: 600; }
  td.number { text-align: right; font-variant-numeric: tabular-nums; }
  #examples { max-width: 820px; margin: 0 auto 14px; display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  #examples button { font-size: 13px; color: var(--accent); }
  form {
    background: var(--card); border-top: 1px solid var(--line); padding: 12px 20px;
  }
  form div { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; }
  input {
    flex: 1; font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #send { background: var(--accent); color: #fff; border-color: var(--accent); }
</style>
</head>
<body>

<header>
  <h1>Weather Risk Intelligence Agent</h1>
  <p>Historical severe-weather exposure of 14 US distribution hubs. Not a forecast.</p>
  <button id="new-chat" type="button">New conversation</button>
</header>

<main>
  <div id="examples">
    <button type="button">Rank Midwest hubs for winter</button>
    <button type="button">Compare Miami and Houston on hurricane and flood risk</button>
    <button type="button">What percent of days had snowfall in Denver last year?</button>
    <button type="button">Why is Dallas's risk high?</button>
    <button type="button">Are there active weather alerts at any of our hubs right now?</button>
    <button type="button">Any active weather alerts in the Midwest?</button>
  </div>
  <div id="chat"></div>
</main>

<form id="form">
  <div>
    <input id="question" autocomplete="off" autofocus placeholder="Ask about hub weather risk…">
    <button id="send" type="submit">Send</button>
  </div>
</form>

<script>
// The page talks only to POST /chat. It shows what the server returns and
// computes nothing: every number on screen comes from the agent's answer or
// its tool trace.

const chat = document.getElementById("chat");
const form = document.getElementById("form");
const question = document.getElementById("question");
const send = document.getElementById("send");

let sessionId = null;  // set by the first reply; sent back so follow-ups work

// Create an element. Text always goes in through textContent, never innerHTML.
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

// The answer text, with the model's **bold** markers shown as bold.
function answerText(text) {
  const node = el("div", "text");
  text.split("**").forEach((part, index) => {
    node.appendChild(index % 2 === 1 ? el("strong", "", part) : document.createTextNode(part));
  });
  return node;
}

function addMessage(className, text) {
  const node = el("div", "message " + className, text);
  chat.appendChild(node);
  node.scrollIntoView({ behavior: "smooth", block: "end" });
  return node;
}

function section(parent, title) {
  parent.appendChild(el("h3", "", title));
}

// The collapsible "How I got this" panel: tools, key figures, assumptions, confidence.
function howIGotThis(turn) {
  const answer = turn.answer;
  const panel = el("details");
  panel.appendChild(el("summary", "", "How I got this"));

  section(panel, "Tools used");
  if (turn.trace.length === 0) {
    panel.appendChild(el("div", "result", "No tools were called."));
  } else {
    const list = el("ol");
    for (const step of turn.trace) {
      const item = el("li");
      item.appendChild(el("code", "", step.tool + "(" + JSON.stringify(step.arguments) + ")"));
      item.appendChild(el("div", "result", "→ " + step.result));
      list.appendChild(item);
    }
    panel.appendChild(list);
  }

  if (answer.key_figures.length > 0) {
    section(panel, "Key figures");
    const table = el("table");
    const head = el("tr");
    for (const title of ["Figure", "Value", "Unit", "From tool"]) head.appendChild(el("th", "", title));
    table.appendChild(head);
    for (const figure of answer.key_figures) {
      const row = el("tr");
      row.appendChild(el("td", "", figure.label));
      row.appendChild(el("td", "number", String(figure.value)));
      row.appendChild(el("td", "", figure.unit));
      row.appendChild(el("td", "", figure.source_tool));
      table.appendChild(row);
    }
    panel.appendChild(table);
  }

  section(panel, "Assumptions");
  const assumptions = el("ul");
  for (const assumption of answer.assumptions) assumptions.appendChild(el("li", "", assumption));
  panel.appendChild(assumptions);

  section(panel, "Confidence");
  const confidence = el("div");
  confidence.appendChild(el("span", "badge " + answer.confidence, answer.confidence));
  confidence.appendChild(el("span", "", " " + answer.confidence_reason));
  panel.appendChild(confidence);

  if (turn.retries.length > 0) {
    section(panel, "Rejected attempts");
    const retries = el("ul");
    for (const reason of turn.retries) retries.appendChild(el("li", "", reason));
    panel.appendChild(retries);
  }
  return panel;
}

function showTurn(node, turn) {
  node.className = "message agent";
  node.textContent = "";
  if (turn.error) {
    node.classList.add("error");
    node.textContent = "Error (" + turn.error.type + "): " + turn.error.message;
    return;
  }
  if (turn.answer.out_of_scope) node.appendChild(el("div", "badge", "Out of scope"));
  node.appendChild(answerText(turn.answer.answer));
  node.appendChild(howIGotThis(turn));
}

async function ask(text) {
  addMessage("user", text);
  const node = addMessage("agent pending", "Working…");
  send.disabled = true;
  try {
    const response = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, session_id: sessionId }),
    });
    if (!response.ok) throw new Error("The server answered " + response.status);
    const turn = await response.json();
    sessionId = turn.session_id;
    showTurn(node, turn);
  } catch (error) {
    node.className = "message agent error";
    node.textContent = "Could not reach the agent: " + error.message;
  }
  send.disabled = false;
  node.scrollIntoView({ behavior: "smooth", block: "end" });
  question.focus();
}

form.addEventListener("submit", (event) => {
  event.preventDefault();
  const text = question.value.trim();
  if (!text || send.disabled) return;
  question.value = "";
  ask(text);
});

for (const button of document.querySelectorAll("#examples button")) {
  button.addEventListener("click", () => { if (!send.disabled) ask(button.textContent); });
}

document.getElementById("new-chat").addEventListener("click", () => {
  sessionId = null;  // the next question starts a fresh session on the server
  chat.textContent = "";
  question.focus();
});
</script>
</body>
</html>
